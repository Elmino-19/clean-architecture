[project]
name = "clean-architecture"
version = "3.0.0"
description = "Python FastAPI backend template, organized by Clean Architecture layers (domain, application, infrastructure, presentation) and DDD principles. Includes dependency management, Docker support, testing boilerplate, CI-friendly setup and best practices, modular scaffolding to jump-start new projects and ensure long-term maintainability."
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "Erfan Mohamadnia", email = "zelzeleh.19@gmail.com"}]
license = {text = "MIT"}
urls = {Homepage = "https://github.com/Elmino-19/clean-architecture", Repository = "https://github.com/Elmino-19/clean-architecture"}
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "black>=26.10.1",
    "cryptography>=46.0.5",
    "fastapi[standard]>=0.135.1",
    "greenlet>=3.1.1",
    "hypercorn>=0.18.0",
    "jwcrypto>=1.5.6",
    "loguru>=0.7.3",
    "orjson>=3.11.7",
    "psycopg>=3.3.3",
    "psycopg-binary>=3.3.3",
    "psycopg2-binary>=2.9.11",
    "pwdlib[argon2]>=0.3.0",
    "py-automapper>=2.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "redis>=7.4.0",
    "ruff>=0.17.0",
    "sqlalchemy>=2.0.48",
    "stackprinter>=0.2.12",
]

[project.scripts]
fastddd = "fastddd.cli:main"

[dependency-groups]
dev = [
    "ngrok>=1.7.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  ".opencode/node_modules",
  ".opencode/package.json",
  ".opencode/package-lock.json",
]

[tool.hatch.build.targets.wheel]
packages = ["fastddd"]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "fastddd/data/scripts"
".opencode/agent" = "fastddd/data/opencode/agent"
".opencode/command" = "fastddd/data/opencode/command"
".opencode/skills" = "fastddd/data/opencode/skills"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".opencode", ".me", "secrets"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "RUF", # ruff-specific
]
ignore = [
    "BLE001", # blind except is intentional at the domain/transport boundary
    "E501",   # long lines are comments/URLs/OpenAPI docs; the formatter wraps code
    "UP042",  # keep `(str, Enum)`: StrEnum would change `str(member)` semantics
]

[tool.ruff.lint.per-file-ignores]
"app/modules/*/infrastructure/models.py" = ["UP037"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]
